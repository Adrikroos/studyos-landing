 de cuenta: nombre (o apodo), correo electrónico y contraseña (almacenada solo como hash criptográfico, nunca en texto plano).","Contenido académico que tú creas o subes: asignaturas, tareas, exámenes, apuntes, documentos (PDF, imágenes, fotos), resúmenes generados y tu progreso de estudio (sesiones, estadísticas, dominio por tema).","Datos técnicos: identificadores de sesión necesarios para la sincronización entre dispositivos y registros de errores para diagnosticar fallos."]},{title:"3. Para qué los usamos",body:["Tratamos tus datos únicamente para:"],list:["Prestar el servicio: guardar tu contenido académico y sincronizarlo entre tus dispositivos.","Funciones de IA: generar resúmenes, fichas y análisis de los materiales que tú subes (ver sección 5).","Seguridad: autenticarte, proteger tu cuenta y prevenir abusos.","Soporte: atenderte si nos escribes."]},{title:"4. Qué NO hacemos con tus datos",body:["No vendemos ni alquilamos tus datos personales a nadie.","No mostramos publicidad ni usamos rastreadores publicitarios.","No usamos tu contenido académico para entrenar modelos de IA.","No tratamos categorías especiales de datos."]},{title:"5. Inteligencia artificial (Google Gemini)",body:["Las funciones de resúmenes y análisis de documentos se procesan en nuestros servidores mediante la API de Google (Gemini). Cuando pides un resumen, enviamos el texto del documento que tú has subido para procesarlo.","No enviamos tu contraseña ni datos de contacto al proveedor de IA. El contenido académico se envía solo para generar el resultado que has solicitado, con conexión cifrada."]},{title:"6. Dónde se guardan tus datos y durante cuánto tiempo",body:["En tu dispositivo: una copia local de tu contenido académico para que la app funcione sin conexión. Las credenciales de sesión se guardan cifradas en el almacenamiento seguro de Android.","En nuestros servidores: tu cuenta y tu contenido académico, mientras tu cuenta esté activa.","Cuando eliminas tu cuenta, suprimimos tus datos personales y tu contenido académico de nuestros sistemas, salvo lo que debamos conservar por obligación legal."]},{title:"7. Menores de edad",body:["StudyOS está pensado para estudiantes, incluidos menores de edad. Si eres menor de 14 años, necesitas el permiso de tu padre, madre o tutor legal para usar la aplicación.","Padres y tutores pueden contactarnos para ejercer los derechos de acceso, rectificación o supresión sobre los datos de sus hijos."]},{title:"8. Tus derechos",body:["Puedes ejercer en cualquier momento tus derechos de acceso, rectificación, supresión, limitación, oposición y portabilidad escribiéndonos a agtmill04@gmail.com.","También puedes presentar una reclamación ante la Agencia Española de Protección de Datos (www.aepd.es)."]},{title:"9. Seguridad",body:["Aplicamos medidas técnicas y organizativas apropiadas: cifrado de las comunicaciones (TLS), contraseñas almacenadas como hash, tokens de sesión cifrados en el dispositivo, acceso restringido a los datos y registros de auditoría de nuestros sistemas.","Ningún sistema es infalible; si detectamos una brecha que afecte a tus datos, te lo notificaremos conforme a la normativa aplicable."]},{title:"10. Cambios en esta política",body:["Si cambiamos esta política de forma relevante, te lo avisaremos dentro de la aplicación antes de que entre en vigor. La fecha de la última actualización aparece al final de esta página."]}];function x4(){return g.jsxs("div",{className:"relative min-h-screen bg-ink-950 text-white",children:[g.jsx("div",{className:"pointer-events-none absolute inset-x-0 top-0 h-96 bg-[radial-gradient(ellipse_at_top,rgba(124,58,237,0.18),transparent_70%)]"}),g.jsx("header",{className:"relative border-b border-white/[0.06]",children:g.jsxs(Be,{className:"flex h-16 items-center justify-between",children:[g.jsx("a",{href:"#/","aria-label":"Volver al inicio",children:g.jsx(ad,{})}),g.jsx("a",{href:"#/",className:"text-sm text-white/60 transition-colors hover:text-white",children:"← Volver al
